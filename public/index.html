<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrazos Virtuales en Vivo</title>
  <style>

    @font-face {
      font-family: 'Alin';
      src: url('DrawingfontAlinrone3-Regular.ttf') format('truetype');
    }
    
    
    :root {
      --bg: #0f172a;
      --panel: rgba(30, 41, 59, 0.72);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #ec4899;
      --accent-2: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: 'Alin';
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.16), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.18), transparent 40%),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .glass {
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-group h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .dot.online {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Pantalla de login */
    #login-screen {
      text-align: center;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    #login-screen p {
      color: var(--muted);
      max-width: 420px;
      line-height: 1.5;
    }

    .input-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      transition: transform 0.15s ease, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.97);
    }

    /* Sala principal */
    #room-screen {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
    }

    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .user-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .user-card:hover {
      border-color: rgba(236, 72, 153, 0.45);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #0f172a;
      flex-shrink: 0;
    }

    .user-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .you-tag {
      font-size: 0.72rem;
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      padding: 2px 7px;
      border-radius: 6px;
      margin-left: 4px;
    }

    .hug-btn {
      padding: 8px 12px;
      font-size: 0.85rem;
      border-radius: 10px;
      flex-shrink: 0;
    }

    /* Banner animado de abrazo recibido */
    #hug-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .hug-popup {
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid var(--accent);
      box-shadow: 0 0 40px rgba(236, 72, 153, 0.45);
      border-radius: 24px;
      padding: 28px 36px;
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .hug-popup h2 {
      font-size: 1.5rem;
      margin: 12px 0 6px;
      background: linear-gradient(90deg, #f472b6, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hug-popup p {
      color: var(--text);
      font-size: 1.05rem;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.75) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Historial en vivo */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .feed-item {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.25s ease;
    }

    .feed-item strong {
      color: #f472b6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="hug-overlay"></div>

  <main class="app">
    <header class="glass">
      <div class="title-group">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
        <h1>Abrazos Virtuales</h1>
      </div>
      <div class="status-pill">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">Conectando...</span>
      </div>
    </header>

    <!-- Pantalla 1: Elegir nombre -->
    <section id="login-screen" class="glass">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <h2>¿Cómo te llamas?</h2>
      <p>Escribe tu nombre para aparecer en la sala y enviar abrazos virtuales a quienes estén conectados ahora mismo.</p>
      <form class="input-row" id="join-form">
        <input type="text" id="name-input" placeholder="Tu nombre..." maxlength="24" required autocomplete="off" />
        <button type="submit">Entrar</button>
      </form>
    </section>

    <!-- Pantalla 2: Usuarios conectados y abrazos -->
    <section id="room-screen">
      <div class="glass">
        <div class="section-title">
          <span>Conectados ahora</span>
          <span id="user-count">0 en línea</span>
        </div>
        <div class="users-grid" id="users-grid"></div>
      </div>

      <div class="glass">
        <div class="section-title">
          <span>Actividad de abrazos</span>
        </div>
        <div class="feed" id="feed">
          <div class="feed-item" style="color: var(--muted);">Esperando el primer abrazo...</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);

    const connDot = document.getElementById('conn-dot');
    const connText = document.getElementById('conn-text');
    const loginScreen = document.getElementById('login-screen');
    const roomScreen = document.getElementById('room-screen');
    const joinForm = document.getElementById('join-form');
    const nameInput = document.getElementById('name-input');
    const usersGrid = document.getElementById('users-grid');
    const userCount = document.getElementById('user-count');
    const feed = document.getElementById('feed');
    const hugOverlay = document.getElementById('hug-overlay');

    let myId = null;
    let myName = '';
    let firstFeedCleared = false;

    ws.addEventListener('open', () => {
      connDot.classList.add('online');
      connText.textContent = 'En línea';
    });

    ws.addEventListener('close', () => {
      connDot.classList.remove('online');
      connText.textContent = 'Desconectado';
    });

    joinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'join', name }));
    });

    ws.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'welcome') {
        myId = data.id;
        myName = data.name;
        loginScreen.style.display = 'none';
        roomScreen.style.display = 'flex';
      }

      if (data.type === 'users') {
        renderUsers(data.users);
      }

      if (data.type === 'hug_received') {
        addFeedMessage(data.fromName, data.toName);
        if (data.toId === myId || data.fromId === myId) {
          showHugPopup(data.fromName, data.toName);
        }
      }
    });

    function renderUsers(users) {
      userCount.textContent = `${users.length} en línea`;
      usersGrid.innerHTML = '';

      users.forEach((user) => {
        const isMe = user.id === myId;
        const card = document.createElement('div');
        card.className = 'user-card';

        const initial = user.name.charAt(0).toUpperCase();

        card.innerHTML = `
          <div class="user-info">
            <div class="avatar" style="background: ${user.color}">${initial}</div>
            <div class="user-name">
              ${escapeHtml(user.name)}
              ${isMe ? '<span class="you-tag">Tú</span>' : ''}
            </div>
          </div>
          ${!isMe ? `<button class="hug-btn" data-id="${user.id}">Abrazar</button>` : ''}
        `;

        if (!isMe) {
          card.querySelector('.hug-btn').addEventListener('click', () => {
            ws.send(JSON.stringify({ type: 'hug', to: user.id }));
          });
        }

        usersGrid.appendChild(card);
      });
    }

    function addFeedMessage(fromName, toName) {
      if (!firstFeedCleared) {
        feed.innerHTML = '';
        firstFeedCleared = true;
      }
      const item = document.createElement('div');
      item.className = 'feed-item';
      item.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ec4899" stroke="#ec4899" stroke-width="2">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
        <span><strong>${escapeHtml(fromName)}</strong> le envió un abrazo virtual a <strong>${escapeHtml(toName)}</strong></span>
      `;
      feed.prepend(item);
    }

    let popupTimeout = null;
    function showHugPopup(fromName, toName) {
      clearTimeout(popupTimeout);
      hugOverlay.innerHTML = `
        <div class="hug-popup">
          <svg width="54" height="54" viewBox="0 0 24 24" fill="#ec4899" stroke="#f472b6" stroke-width="1.5">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
          <h2>¡Abrazo Virtual!</h2>
          <p><strong>${escapeHtml(fromName)}</strong> abrazó a <strong>${escapeHtml(toName)}</strong></p>
        </div>
      `;
      popupTimeout = setTimeout(() => {
        hugOverlay.innerHTML = '';
      }, 3200);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }
  </script>
</body>
</html>
